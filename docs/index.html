<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/impacgo-chain-frontend/docs/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IMPACGO Chain">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>IMPACGO Chain — Supply Chain Management</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#f1f3f8">
  <!-- Shown at once while the app downloads (the first open on a phone can take a little while),
       removed as soon as the app draws its first screen. -->
  <div id="impacgo-loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Segoe UI,Roboto,Arial,sans-serif;color:#1e293b;background:#f1f3f8;z-index:9999;text-align:center;padding:24px">
    <div style="width:56px;height:56px;border-radius:14px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px">IC</div>
    <div style="margin-top:18px;font-size:18px;font-weight:700">IMPACGO Chain</div>
    <div style="margin-top:6px;font-size:14px;color:#64748b">Loading… please wait</div>
    <div style="margin-top:20px;width:34px;height:34px;border:4px solid #dbe3f0;border-top-color:#2563eb;border-radius:50%;animation:impacgo-spin 0.9s linear infinite"></div>
    <div id="impacgo-slow" style="display:none;margin-top:20px;font-size:13px;color:#64748b;max-width:320px;line-height:1.5">
      Still loading — the first open downloads the app (about 12 MB), which can take a minute on mobile data.
      Please keep this page open. If it stays here, open the link in Chrome or Safari (not inside WhatsApp) and check the internet connection.
    </div>
  </div>
  <style>@keyframes impacgo-spin{to{transform:rotate(360deg)}}</style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('impacgo-loading');
      if (el) el.remove();
    });
    setTimeout(function () {
      var s = document.getElementById('impacgo-slow');
      if (s) s.style.display = 'block';
    }, 15000);
  </script>
  <script>
    // always run the latest version: remove any offline copy an earlier version saved in this browser
    try {
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
      if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    } catch (e) {}
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
